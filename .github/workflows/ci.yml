name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy
        run: mypy src/pyautostat

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q --cov=pyautostat --cov-report=term-missing --cov-fail-under=90

  minimum-numerical-stack:
    name: Minimum numerical-stack compatibility
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimum numerical stack
        run: |
          pip install numpy==1.23.5 pandas==1.5.3 scipy==1.8.0 statsmodels==0.15.0 pytest
          pip install -e . --no-deps
      - name: Verify minimum-stack multi-group, regression, extended association, repeated measures, two-way anova, icc, and uncertainty paths
        run: pytest -q tests/test_multigroup_analysis.py tests/test_regression_workflow.py tests/test_binary_extended_association.py tests/test_repeated_measures.py tests/test_effect_size_confidence_intervals.py tests/test_uncertainty_hardening.py tests/test_two_way_anova.py tests/test_two_way_anova_followups.py tests/test_two_way_anova_validation.py tests/test_two_way_anova_audit.py tests/test_icc.py tests/test_icc_confidence_intervals.py tests/test_icc_validation.py tests/test_icc_audit.py tests/test_icc_workflow.py

  build:
    name: Build distribution
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Smoke installed wheel in an isolated environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -I tests/installed_wheel_smoke.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pdf-integration:
    name: PDF export integration (Python 3.12, ubuntu-latest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev, pdf, report, and docx extras
        run: pip install -e ".[dev,pdf,report,docx]"
      - name: Install Chromium with system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run PDF and full publication bundle integration tests
        run: pytest -q tests/test_pdf_integration.py tests/test_bundle_full_integration.py
      - name: Run PDF reporting showcase example
        run: python examples/15_pdf_reporting.py --output-dir generated-sample-pdfs
      - name: Upload sample PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdfs
          path: generated-sample-pdfs/

  docx-integration:
    name: DOCX export integration (Python 3.12, ubuntu-latest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev and docx extras
        run: pip install -e ".[dev,docx]"
      - name: Run DOCX integration tests
        run: pytest -q tests/test_docx_api.py tests/test_docx_presentation.py tests/test_docx_research_report.py tests/test_docx_security.py
      - name: Run DOCX reporting showcase example
        run: python examples/16_docx_reporting.py --output-dir generated-sample-docx
      - name: Upload sample DOCX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-docx
          path: generated-sample-docx/

  bundle-integration:
    name: Bundle integration (lightweight, Python 3.12, ubuntu-latest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev and docx extras
        run: pip install -e ".[dev,docx]"
      - name: Run bundle API, manifest, verification, and security tests
        run: pytest -q tests/test_bundle_api.py tests/test_bundle_manifest.py tests/test_bundle_verification.py tests/test_bundle_security.py
      - name: Run bundle showcase example
        run: python examples/17_research_export_bundle.py --output-dir generated-sample-bundles
      - name: Upload sample bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-bundles
          path: generated-sample-bundles/

  static-figure-integration:
    name: Static figure export integration (Python 3.12, ubuntu-latest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev, figures, and docx extras
        run: pip install -e ".[dev,figures,docx]"
      - name: Install Chrome for Kaleido
        run: plotly_get_chrome
      - name: Run static figure, docx figure, and bundle figure tests
        run: pytest -q tests/test_static_figures_api.py tests/test_static_figures_fidelity.py tests/test_static_figures_security.py tests/test_docx_figures.py tests/test_bundle_static_figures.py
      - name: Run static figures showcase example
        run: python examples/18_static_scientific_figures.py --output-dir generated-sample-figures
      - name: Upload sample figure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-figures
          path: generated-sample-figures/




